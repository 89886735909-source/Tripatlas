
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12343b">
<title>TripAtlas — путешествия и цены</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7f3;color:#1d3032;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}
header{background:linear-gradient(145deg,#12343b,#246451);color:white;padding:25px 18px;border-radius:0 0 25px 25px}
.brand{font-size:23px;font-weight:800}
header h1{font-size:29px;line-height:1.1;margin:22px 0 8px}
header p{color:#d7e6df}
.search{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px}
.tabs{display:flex;gap:5px;padding:12px;position:sticky;top:0;background:#f5f7f3;z-index:2}
.tab{flex:1;padding:12px 3px;border:0;border-radius:12px;background:#e5eee8;color:#23463e;font-weight:bold}
.tab.active{background:#173b3c;color:white}
main{max-width:720px;margin:auto;padding:8px 14px}
.card{background:white;border:1px solid #e0e9e2;border-radius:18px;padding:14px;margin:12px 0;overflow:hidden}
.card h3{margin:4px 0 7px}
.muted{color:#718078;font-size:13px;line-height:1.5}
.post-photo{width:100%;max-height:380px;object-fit:cover;border-radius:14px;margin-top:12px;display:block}
.primary,.secondary{border:0;border-radius:12px;padding:13px;font-weight:bold;cursor:pointer}
.primary{background:#1e6757;color:white}
.secondary{background:#e3efe7;color:#205747}
.full{width:100%}
.fab{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border:0;border-radius:20px;background:#174f45;color:white;font-size:30px;z-index:5;box-shadow:0 5px 18px #0002}
.modal{position:fixed;inset:0;background:#10282c99;z-index:10;display:flex;align-items:flex-end}
.modal.hidden{display:none}
.sheet{background:#f5f7f3;border-radius:24px 24px 0 0;padding:20px 16px calc(25px + env(safe-area-inset-bottom));width:100%;max-height:93dvh;overflow:auto}
.sheet h2{margin:0 0 16px}
form{display:grid;gap:12px}
label{display:grid;gap:6px;font-size:14px;font-weight:650}
input,select,textarea{font:inherit;width:100%;min-width:0;padding:12px;border:1px solid #d5e2d8;border-radius:11px;background:white}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-buttons{display:flex;gap:8px}
.photo-buttons button{flex:1;min-width:0;font-size:13px}
.file-hidden{position:absolute!important;width:1px!important;height:1px!important;opacity:0!important;overflow:hidden!important;pointer-events:none!important}
#preview{display:none;width:100%;max-height:250px;object-fit:contain;border-radius:12px;margin-top:10px;background:#e5eee8}
#toast{position:fixed;bottom:92px;left:15px;right:15px;background:#173b3c;color:white;padding:14px;border-radius:12px;z-index:20;text-align:center}
#toast.hidden{display:none}
.price{background:#e4f2e9;border-radius:10px;padding:12px;font-weight:bold;margin-top:10px}
.status{font-size:12px;color:#61776d;font-weight:400}
@media(min-width:650px){
.modal{align-items:center;justify-content:center}
.sheet{max-width:550px;border-radius:24px}
}
</style>
</head>
<body>

<header>
  <div class="brand">✦ TripAtlas</div>
  <h1>Мир глазами путешественников</h1>
  <p>Реальные места, фотографии и цены от людей.</p>
  <input class="search" id="search" placeholder="Найти место, город или цену">
</header>

<nav class="tabs">
  <button class="tab active" data-tab="feed">Лента</button>
  <button class="tab" data-tab="prices">Цены</button>
  <button class="tab" data-tab="profile">Профиль</button>
</nav>

<main id="app"></main>
<button class="fab" id="addBtn" aria-label="Добавить публикацию">＋</button>

<div class="modal hidden" id="modal">
  <div class="sheet">
    <h2>Добавить место или цену</h2>
    <form id="postForm">

      <label>Что добавляем?
        <input name="item" required placeholder="Кафе, пляж, отель, экскурсия">
      </label>

      <div class="two">
        <label>Цена
          <input name="amount" type="number" min="0" step="any" placeholder="75000">
        </label>
        <label>Валюта
          <select name="currency">
            <option value="VND">VND ₫</option>
            <option value="USD">USD $</option>
            <option value="THB">THB ฿</option>
            <option value="EUR">EUR €</option>
            <option value="RUB">RUB ₽</option>
          </select>
        </label>
      </div>

      <label>Категория
        <select name="category">
          <option>Еда и напитки</option>
          <option>Жильё</option>
          <option>Развлечения</option>
          <option>Транспорт</option>
          <option>Экскурсии и услуги</option>
          <option>Место</option>
          <option>Другое</option>
        </select>
      </label>

      <label>Название места
        <input name="place" required placeholder="Название кафе или достопримечательности">
      </label>

      <label>Город и страна
        <input name="location" required placeholder="Фукуок, Вьетнам">
      </label>

      <label>Комментарий
        <textarea name="note" rows="3" placeholder="Полезная информация для путешественников"></textarea>
      </label>

      <label>Фотография
        <div class="photo-buttons">
          <button type="button" class="secondary" id="galleryBtn">🖼 Галерея</button>
          <button type="button" class="secondary" id="cameraBtn">📷 Камера</button>
        </div>

        <input class="file-hidden" id="galleryInput" type="file" accept="image/*">
        <input class="file-hidden" id="cameraInput" type="file" accept="image/*" capture="environment">

        <img id="preview" alt="Предпросмотр фотографии">
        <span class="status" id="photoStatus">Фото больше 4,7 МБ будет автоматически сжато перед загрузкой.</span>
      </label>

      <button class="primary full" id="publishBtn" type="submit">Опубликовать</button>
      <button class="secondary full" id="cancelBtn" type="button">Отмена</button>
    </form>
  </div>
</div>

<div id="toast" class="hidden"></div>

<script>
const SUPABASE_URL="https://txqzbjkdajhzhwmgxiox.supabase.co";
const SUPABASE_KEY="sb_publishable_JHV18XigN7-jYheN__hxWQ_2s77Mz6A";
const BUCKET="tripatlas-photos";
const MAX_SIZE=4.7*1024*1024;

const app=document.getElementById("app");
const modal=document.getElementById("modal");
const form=document.getElementById("postForm");
const galleryInput=document.getElementById("galleryInput");
const cameraInput=document.getElementById("cameraInput");
const preview=document.getElementById("preview");
const photoStatus=document.getElementById("photoStatus");
const publishBtn=document.getElementById("publishBtn");

let posts=[];
let activeTab="feed";
let selectedPhoto=null;
let previewURL=null;

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.remove("hidden");
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>el.classList.add("hidden"),4000);
}

function esc(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function money(amount,currency){
  const n=Number(amount).toLocaleString("ru-RU",{maximumFractionDigits:2});
  if(currency==="VND")return n+" ₫";
  if(currency==="USD")return "$"+n;
  if(currency==="THB")return "฿"+n;
  if(currency==="EUR")return "€"+n;
  if(currency==="RUB")return n+" ₽";
  return n+" "+currency;
}

function openModal(){modal.classList.remove("hidden")}
function closeModal(){modal.classList.add("hidden")}

document.getElementById("addBtn").addEventListener("click",openModal);
document.getElementById("cancelBtn").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{if(e.target===modal)closeModal()});

document.getElementById("galleryBtn").addEventListener("click",()=>{
  galleryInput.click();
});
document.getElementById("cameraBtn").addEventListener("click",()=>{
  cameraInput.click();
});

function clearPreview(){
  if(previewURL){
    URL.revokeObjectURL(previewURL);
    previewURL=null;
  }
  preview.removeAttribute("src");
  preview.style.display="none";
}

function handlePhoto(input){
  const file=input.files&&input.files[0];
  if(!file)return;

  if(!file.type.startsWith("image/")){
    toast("Выбери файл изображения.");
    input.value="";
    return;
  }

  selectedPhoto=file;
  clearPreview();
  previewURL=URL.createObjectURL(file);
  preview.src=previewURL;
  preview.style.display="block";

  const sizeMB=(file.size/1024/1024).toFixed(2);
  photoStatus.textContent=file.size>MAX_SIZE
    ?`Исходный размер ${sizeMB} МБ. Фото будет сжато автоматически.`
    :`Фото ${sizeMB} МБ. Сжатие не требуется.`;
}

galleryInput.addEventListener("change",()=>handlePhoto(galleryInput));
cameraInput.addEventListener("change",()=>handlePhoto(cameraInput));

async function imageToDrawable(file){
  if("createImageBitmap" in window){
    try{
      return await createImageBitmap(file,{imageOrientation:"from-image"});
    }catch(e){}
  }

  const objectURL=URL.createObjectURL(file);
  try{
    return await new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=()=>reject(new Error(
        "Не удалось открыть изображение. Попробуй выбрать фото в формате JPG или PNG."
      ));
      img.src=objectURL;
    });
  }finally{
    URL.revokeObjectURL(objectURL);
  }
}

async function canvasBlob(canvas,quality){
  return new Promise((resolve,reject)=>{
    canvas.toBlob(blob=>{
      if(blob)resolve(blob);
      else reject(new Error("Не удалось сжать фотографию."));
    },"image/jpeg",quality);
  });
}

async function compressImage(file){
  if(file.size<=MAX_SIZE)return file;

  toast("Сжимаем большую фотографию…");

  const image=await imageToDrawable(file);
  const originalWidth=image.width;
  const originalHeight=image.height;

  if(!originalWidth||!originalHeight){
    if(image.close)image.close();
    throw new Error("Не удалось определить размер фотографии.");
  }

  // Ограничиваем длинную сторону до 2560 пикселей для экономии памяти.
  let scale=Math.min(1,2560/Math.max(originalWidth,originalHeight));
  let compressed=null;

  try{
    for(let attempt=0;attempt<14;attempt++){
      const canvas=document.createElement("canvas");
      canvas.width=Math.max(1,Math.round(originalWidth*scale));
      canvas.height=Math.max(1,Math.round(originalHeight*scale));

      const ctx=canvas.getContext("2d");
      if(!ctx)throw new Error("Браузер не смог обработать изображение.");

      ctx.fillStyle="#ffffff";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.drawImage(image,0,0,canvas.width,canvas.height);

      for(const quality of [0.88,0.80,0.72,0.64,0.56,0.48,0.40]){
        const blob=await canvasBlob(canvas,quality);
        if(blob.size<=MAX_SIZE){
          compressed=new File(
            [blob],
            "tripatlas-"+Date.now()+".jpg",
            {type:"image/jpeg",lastModified:Date.now()}
          );
          break;
        }
      }

      canvas.width=1;
      canvas.height=1;

      if(compressed)break;
      scale*=0.75;
    }
  }finally{
    if(image.close)image.close();
  }

  if(!compressed||compressed.size>MAX_SIZE){
    throw new Error("Не удалось сжать фото до 5 МБ. Попробуй другое изображение.");
  }

  const before=(file.size/1024/1024).toFixed(2);
  const after=(compressed.size/1024/1024).toFixed(2);
  photoStatus.textContent=`Фото сжато: ${before} МБ → ${after} МБ.`;
  return compressed;
}

async function uploadPhoto(file){
  if(!file)return null;

  // Автоматически сжимаем файл перед отправкой в Storage.
  const processed=await compressImage(file);
  const path="posts/"+Date.now()+"-"+Math.random().toString(36).slice(2)+".jpg";
  const url=SUPABASE_URL+"/storage/v1/object/"+BUCKET+"/"+path;

  const response=await fetch(url,{
    method:"POST",
    headers:{
      apikey:SUPABASE_KEY,
      Authorization:"Bearer "+SUPABASE_KEY,
      "Content-Type":processed.type||"image/jpeg",
      "x-upsert":"false"
    },
    body:processed
  });

  if(!response.ok){
    let detail="";
    try{
      const result=await response.json();
      detail=result.message||result.error||"";
    }catch(e){}
    throw new Error(detail||"Ошибка загрузки фотографии: "+response.status);
  }

  return SUPABASE_URL+"/storage/v1/object/public/"+BUCKET+"/"+path;
}

function normalize(row){
  let data={};
  try{
    data=JSON.parse(row.description||"{}");
  }catch(e){
    data={item:row.description||"Публикация"};
  }

  const hasPrice=data.amount!==""&&data.amount!==null&&
    data.amount!==undefined&&Number.isFinite(Number(data.amount));

  return{
    id:row.id,
    item:data.item||"Место",
    place:data.place||"",
    location:row.location||"",
    category:data.category||"Место",
    note:data.note||"",
    photo_url:row.photo_url||null,
    created_at:row.created_at||"",
    price:hasPrice?Number(data.amount):null,
    currency:data.currency||"VND"
  };
}

function render(){
  const query=(document.getElementById("search").value||"").toLowerCase();

  const filtered=posts.filter(p=>
    [p.item,p.place,p.location,p.category,p.note]
      .join(" ").toLowerCase().includes(query)
  );

  document.querySelectorAll(".tab").forEach(button=>{
    button.classList.toggle("active",button.dataset.tab===activeTab);
  });

  if(activeTab==="profile"){
    app.innerHTML=`
      <div class="card">
        <h2>Мой профиль</h2>
        <p class="muted">Публикаций в общей базе: ${posts.length}</p>
        <p class="muted">TripAtlas — места, фотографии и цены путешественников.</p>
      </div>`;
    return;
  }

  const list=activeTab==="prices"
    ?filtered.filter(p=>p.price!==null)
    :filtered;

  app.innerHTML=`
    <h2>${activeTab==="prices"?"Цены путешественников":"Лента путешествий"}</h2>
    <p class="muted">Общая база TripAtlas. Фото доступны в публикациях.</p>
    ${list.map(p=>`
      <article class="card">
        <h3>${esc(p.item)}</h3>
        <div class="muted">${esc(p.place)} · ${esc(p.location)}</div>
        ${p.photo_url?`
          <img class="post-photo"
            src="${esc(p.photo_url)}"
            alt="Фото публикации"
            loading="lazy"
            onerror="this.style.display='none'">
        `:""}
        ${p.note?`<p>${esc(p.note)}</p>`:""}
        ${p.price!==null?`
          <div class="price">${money(p.price,p.currency)}</div>
        `:""}
      </article>
    `).join("")}
    ${list.length===0?`
      <div class="card">
        <p>Пока нет записей по этому запросу.</p>
      </div>`:""}
    <button class="primary full" id="addFromList">＋ Добавить публикацию</button>
  `;

  document.getElementById("addFromList").addEventListener("click",openModal);
}

document.querySelectorAll(".tab").forEach(button=>{
  button.addEventListener("click",()=>{
    activeTab=button.dataset.tab;
    render();
  });
});

document.getElementById("search").addEventListener("input",render);

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const f=new FormData(form);
  const amountText=String(f.get("amount")||"").trim();
  const amount=amountText===""?null:Number(amountText);

  if(amountText!==""&&(!Number.isFinite(amount)||amount<0)){
    toast("Проверь указанную цену.");
    return;
  }

  const data={
    item:String(f.get("item")||""),
    amount,
    currency:String(f.get("currency")||"VND"),
    category:String(f.get("category")||"Место"),
    place:String(f.get("place")||""),
    note:String(f.get("note")||"")
  };

  publishBtn.disabled=true;
  publishBtn.textContent=selectedPhoto?"Обработка фото…":"Публикуем…";

  try{
    let photo_url=null;

    if(selectedPhoto){
      const fileToUpload=selectedPhoto;
      photoStatus.textContent="Проверяем размер и сжимаем фотографию при необходимости…";
      photo_url=await uploadPhoto(fileToUpload);
      publishBtn.textContent="Сохраняем публикацию…";
    }

    const post={
      description:JSON.stringify(data),
      location:String(f.get("location")||""),
      photo_url,
      user_name:"Путешественник"
    };

    const response=await fetch(SUPABASE_URL+"/rest/v1/posts",{
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        Authorization:"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json",
        Prefer:"return=representation"
      },
      body:JSON.stringify(post)
    });

    if(!response.ok){
      let detail="";
      try{
        const result=await response.json();
        detail=result.message||result.details||result.hint||"";
      }catch(e){}
      throw new Error(detail||"Ошибка сохранения публикации: "+response.status);
    }

    const rows=await response.json();
    posts.unshift(normalize(rows[0]));

    form.reset();
    selectedPhoto=null;
    galleryInput.value="";
    cameraInput.value="";
    clearPreview();
    photoStatus.textContent="Фото больше 4,7 МБ будет автоматически сжато перед загрузкой.";

    closeModal();
    activeTab="feed";
    render();
    toast("Публикация сохранена!");
  }catch(error){
    console.error("TripAtlas error:",error);
    toast(error.message||"Не удалось опубликовать запись.");
  }finally{
    publishBtn.disabled=false;
    publishBtn.textContent="Опубликовать";
  }
});

async function loadPosts(){
  try{
    const response=await fetch(
      SUPABASE_URL+"/rest/v1/posts?select=id,created_at,description,location,photo_url,user_name&order=created_at.desc&limit=100",
      {
        headers:{
          apikey:SUPABASE_KEY,
          Authorization:"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!response.ok)throw new Error("HTTP "+response.status);

    const rows=await response.json();
    posts=rows.map(normalize);
  }catch(error){
    console.error("TripAtlas load error:",error);
    toast("Не удалось загрузить записи. Проверь подключение к интернету.");
  }

  render();
}

render();
loadPosts();
</script>
</body>
</html>
